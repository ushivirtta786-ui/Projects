<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>512 - Brain Puzzle</title>
<style>
  :root {
    --bg: #faf8ef;
    --board-bg: #bbada0;
    --cell-empty: rgba(238, 228, 218, 0.35);
    --text-dark: #776e65;
    --text-light: #f9f6f2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px 40px;
    color: var(--text-dark);
    touch-action: none;
    user-select: none;
  }
  h1 {
    font-size: 42px;
    margin: 4px 0 2px;
    font-weight: 800;
    color: var(--text-dark);
  }
  .subtitle {
    font-size: 14px;
    margin-bottom: 14px;
    opacity: 0.8;
  }
  .top-row {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .scores {
    display: flex;
    gap: 8px;
  }
  .score-box {
    background: var(--board-bg);
    color: var(--text-light);
    border-radius: 8px;
    padding: 8px 16px;
    text-align: center;
    min-width: 70px;
  }
  .score-box .label {
    font-size: 11px;
    text-transform: uppercase;
    opacity: 0.8;
  }
  .score-box .value {
    font-size: 20px;
    font-weight: 700;
  }
  .new-game-btn {
    background: #8f7a66;
    color: var(--text-light);
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .new-game-btn:active { transform: scale(0.96); }
  .board-wrap {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1 / 1;
  }
  .board {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--board-bg);
    border-radius: 10px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
  }
  .cell-bg {
    background: var(--cell-empty);
    border-radius: 6px;
  }
  .tiles-layer {
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
  }
  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-weight: 800;
    transition: top 0.12s ease-in-out, left 0.12s ease-in-out, transform 0.1s ease;
  }
  .tile.new { animation: pop 0.18s ease; }
  .tile.merged { animation: merge 0.15s ease; }
  @keyframes pop {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }
  @keyframes merge {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .message-overlay {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.85);
    border-radius: 10px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 20;
  }
  .message-overlay.show { display: flex; }
  .message-overlay .msg {
    font-size: 32px;
    font-weight: 800;
    color: var(--text-dark);
  }
  .message-overlay button {
    background: #8f7a66;
    color: var(--text-light);
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .instructions {
    max-width: 420px;
    text-align: center;
    font-size: 13px;
    margin-top: 16px;
    opacity: 0.75;
    line-height: 1.5;
  }
</style>
</head>
<body>

<h1>512</h1>
<div class="subtitle">Tiles jodo, 512 tak pahucho!</div>

<div class="top-row">
  <div class="scores">
    <div class="score-box">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="score-box">
      <div class="label">Best</div>
      <div class="value" id="best">0</div>
    </div>
  </div>
  <button class="new-game-btn" id="newGameBtn">Naya Game</button>
</div>

<div class="board-wrap">
  <div class="board" id="board">
    <!-- 16 background cells -->
  </div>
  <div class="tiles-layer" id="tilesLayer"></div>
  <div class="message-overlay" id="messageOverlay">
    <div class="msg" id="messageText"></div>
    <button id="overlayBtn">Phir Se Khelo</button>
  </div>
</div>

<div class="instructions">
  Arrow keys / swipe karke tiles move karo. Same number ke tiles milne par jud jaate hain! 512 banate hi game finish ho jayega.
</div>

<script>
(function() {
  const SIZE = 4;
  let grid = [];
  let score = 0;
  let best = 0;
  let won = false;
  let gameActive = true;
  const TARGET_VALUE = 512;

  const boardEl = document.getElementById('board');
  const tilesLayer = document.getElementById('tilesLayer');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('messageOverlay');
  const messageText = document.getElementById('messageText');

  const tileColors = {
    2: ['#eee4da', '#776e65'],
    4: ['#ede0c8', '#776e65'],
    8: ['#f2b179', '#f9f6f2'],
    16: ['#f59563', '#f9f6f2'],
    32: ['#f67c5f', '#f9f6f2'],
    64: ['#f65e3b', '#f9f6f2'],
    128: ['#edcf72', '#f9f6f2'],
    256: ['#edcc61', '#f9f6f2'],
    512: ['#edc850', '#f9f6f2'],
    1024: ['#edc53f', '#f9f6f2'],
    2048: ['#edc22e', '#f9f6f2'],
  };

  function getBestKey() {
    return 'game2048_best_score';
  }

  function loadBest() {
    // In-memory only fallback since storage may not persist; try safe localStorage read
    try {
      const v = localStorage.getItem(getBestKey());
      return v ? parseInt(v, 10) : 0;
    } catch (e) {
      return 0;
    }
  }

  function saveBest(v) {
    try {
      localStorage.setItem(getBestKey(), String(v));
    } catch (e) {
      // ignore
    }
  }

  function createEmptyGrid() {
    const g = [];
    for (let r = 0; r < SIZE; r++) {
      g.push(new Array(SIZE).fill(0));
    }
    return g;
  }

  function buildBoardBackground() {
    boardEl.innerHTML = '';
    for (let i = 0; i < SIZE * SIZE; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell-bg';
      boardEl.appendChild(cell);
    }
  }

  function getEmptyCells() {
    const cells = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) cells.push([r, c]);
      }
    }
    return cells;
  }

  function addRandomTile() {
    const empty = getEmptyCells();
    if (empty.length === 0) return null;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    const value = Math.random() < 0.9 ? 2 : 4;
    grid[r][c] = value;
    return { r, c, value };
  }

  function cellSizePercent() {
    return 100 / SIZE;
  }

  function renderTiles(newTilePositions, mergedPositions) {
    tilesLayer.innerHTML = '';
    const gapPercent = 2.5; // approx visual gap factor within layer
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const value = grid[r][c];
        if (value === 0) continue;
        const tile = document.createElement('div');
        tile.className = 'tile';
        const isNew = newTilePositions && newTilePositions.some(p => p[0] === r && p[1] === c);
        const isMerged = mergedPositions && mergedPositions.some(p => p[0] === r && p[1] === c);
        if (isNew) tile.classList.add('new');
        if (isMerged) tile.classList.add('merged');

        const sizePct = cellSizePercent();
        const gapPx = 10;
        tile.style.width = `calc(${sizePct}% - ${gapPx * (SIZE - 1) / SIZE}px)`;
        tile.style.height = tile.style.width;
        tile.style.left = `calc(${c * sizePct}% + ${gapPx * c / SIZE}px)`;
        tile.style.top = `calc(${r * sizePct}% + ${gapPx * r / SIZE}px)`;

        const colors = tileColors[value] || ['#3c3a32', '#f9f6f2'];
        tile.style.background = colors[0];
        tile.style.color = colors[1];

        let fontSize = 32;
        if (value >= 100 && value < 1000) fontSize = 28;
        else if (value >= 1000) fontSize = 22;
        tile.style.fontSize = fontSize + 'px';

        tile.textContent = value;
        tilesLayer.appendChild(tile);
      }
    }
  }

  function updateScore(delta) {
    score += delta;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      saveBest(best);
    }
  }

  function resetScore() {
    score = 0;
    scoreEl.textContent = '0';
  }

  function cloneGrid(g) {
    return g.map(row => row.slice());
  }

  function gridsEqual(a, b) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (a[r][c] !== b[r][c]) return false;
      }
    }
    return true;
  }

  // Slide + merge a single line (array of length SIZE), returns {line, gained, merged}
  function processLine(line) {
    const filtered = line.filter(v => v !== 0);
    const result = [];
    let gained = 0;
    const mergedFlags = [];
    let i = 0;
    while (i < filtered.length) {
      if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
        const mergedValue = filtered[i] * 2;
        result.push(mergedValue);
        mergedFlags.push(true);
        gained += mergedValue;
        i += 2;
      } else {
        result.push(filtered[i]);
        mergedFlags.push(false);
        i += 1;
      }
    }
    while (result.length < SIZE) {
      result.push(0);
      mergedFlags.push(false);
    }
    return { line: result, gained, mergedFlags };
  }

  function move(direction) {
    if (!gameActive) return false;
    // direction: 'left','right','up','down'
    const before = cloneGrid(grid);
    let totalGained = 0;
    const mergedPositions = [];

    if (direction === 'left' || direction === 'right') {
      for (let r = 0; r < SIZE; r++) {
        let line = grid[r].slice();
        if (direction === 'right') line = line.reverse();
        const { line: newLine, gained, mergedFlags } = processLine(line);
        totalGained += gained;
        let finalLine = newLine;
        let flags = mergedFlags;
        if (direction === 'right') {
          finalLine = newLine.slice().reverse();
          flags = mergedFlags.slice().reverse();
        }
        grid[r] = finalLine;
        for (let c = 0; c < SIZE; c++) {
          if (flags[c]) mergedPositions.push([r, c]);
        }
      }
    } else {
      for (let c = 0; c < SIZE; c++) {
        let line = [];
        for (let r = 0; r < SIZE; r++) line.push(grid[r][c]);
        if (direction === 'down') line = line.reverse();
        const { line: newLine, gained, mergedFlags } = processLine(line);
        totalGained += gained;
        let finalLine = newLine;
        let flags = mergedFlags;
        if (direction === 'down') {
          finalLine = newLine.slice().reverse();
          flags = mergedFlags.slice().reverse();
        }
        for (let r = 0; r < SIZE; r++) {
          grid[r][c] = finalLine[r];
          if (flags[r]) mergedPositions.push([r, c]);
        }
      }
    }

    const moved = !gridsEqual(before, grid);
    if (moved) {
      updateScore(totalGained);
      const newTile = addRandomTile();
      renderTiles(newTile ? [[newTile.r, newTile.c]] : [], mergedPositions);
      checkWin();
      checkGameOver();
    }
    return moved;
  }

  function checkWin() {
    if (won) return;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === TARGET_VALUE) {
          won = true;
          gameActive = false;
          showMessage(TARGET_VALUE + ' Achieve Kar Liya! 🎉');
        }
      }
    }
  }

  function canMove() {
    if (getEmptyCells().length > 0) return true;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        if (c + 1 < SIZE && grid[r][c + 1] === v) return true;
        if (r + 1 < SIZE && grid[r + 1][c] === v) return true;
      }
    }
    return false;
  }

  function checkGameOver() {
    if (!gameActive) return;
    if (!canMove()) {
      gameActive = false;
      showMessage('Game Over');
    }
  }

  function showMessage(text) {
    messageText.textContent = text;
    overlay.classList.add('show');
  }

  function hideMessage() {
    overlay.classList.remove('show');
  }

  function startNewGame() {
    grid = createEmptyGrid();
    won = false;
    gameActive = true;
    resetScore();
    hideMessage();
    addRandomTile();
    addRandomTile();
    renderTiles();
  }

  // Keyboard controls
  window.addEventListener('keydown', (e) => {
    const map = {
      ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
      a: 'left', d: 'right', w: 'up', s: 'down'
    };
    const dir = map[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  // Touch controls (swipe)
  let touchStartX = 0, touchStartY = 0;
  const boardWrap = document.querySelector('.board-wrap');
  boardWrap.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });

  boardWrap.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);
    const threshold = 20;
    if (Math.max(absDx, absDy) < threshold) return;
    if (absDx > absDy) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  document.getElementById('newGameBtn').addEventListener('click', startNewGame);
  document.getElementById('overlayBtn').addEventListener('click', startNewGame);

  // Init
  buildBoardBackground();
  best = loadBest();
  bestEl.textContent = best;
  startNewGame();
})();
</script>

</body>
</html>
